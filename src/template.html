<!DOCTYPE html>
<html>
<head>
    
</head>
<body>
    <div class="container">
        <form>
            <label for="latitude">Latitude: </label><input id="latitude" type="number" step="0.000001" min="-90.000000" max="90.000000" placeholder="0.000000" required>
            <label for="longitude">Longitude: </label><input id="longitude" type="number" step="0.000001" min="-180.000000" max="180.000000" placeholder="0.000000" required>
            <button>Search</button>
        </form>
        <div class="degree-select">
            <input type="radio" id="fahrenheit" name="degree-unit" class="degree-unit" value="fahrenheit" checked><label for="fahrenheit">Fahrenheit</label>
            <input type="radio" id="celcius" name="degree-unit" class="degree-unit" value="celcius"><label for="celcius">Celcius</label>
        </div>
        <div class="weather-content"></div>
    </div>
</body>

</html>
